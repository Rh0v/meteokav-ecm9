# meteokav-ecm9 - ECMWF IFS 9 km open data -> meteokav.gr's precipitation map (ecm9/build.py has the why + the format).
# A cheap check (stdlib Python, no installs) asks the mirrors whether a newer complete run is out; only then eccodes is
# installed and the pictures built. WHEN (2026-10-21, measured from the files' Last-Modified): ECMWF releases each run's
# 9 km folder in one go, 2 h after the 0.25 deg open data - 00Z 09:34, 06Z 14:27, 12Z 21:34, 18Z 02:27 UTC. GitHub's
# every-30-min schedule fired once in 6 h on this new repository, so the checks now aim at those releases (a few
# minutes after, two retries) plus a slow catch-all every 3 h. The result is force-pushed as ONE commit to the "data" branch (no history
# piles up); the host pulls it from raw.githubusercontent.com (wxprecip/pull.php). No secrets anywhere: the job uses only
# the built-in GITHUB_TOKEN to push to its own repository.
# NOTE: GitHub turns scheduled workflows off after 60 days without repository activity - the data pushes count as
# activity; if the map ever stops, check the Actions tab first (re-enable the workflow there).
name: ecm9

on:
  schedule:
    # UTC; GitHub may start a scheduled run several minutes late
    - cron: "38,53 2 * * *"      # 18Z (out 02:27)
    - cron: "23 3 * * *"
    - cron: "44,59 9 * * *"      # 00Z (out 09:34)
    - cron: "29 10 * * *"
    - cron: "38,53 14 * * *"     # 06Z (out 14:27)
    - cron: "23 15 * * *"
    - cron: "44,59 21 * * *"     # 12Z (out 21:34)
    - cron: "29 22 * * *"
    - cron: "7 */3 * * *"        # catch-all (a late release, a missed run)
  workflow_dispatch:             # the "Run workflow" button in the Actions tab
    inputs:
      force:
        description: "Rebuild the newest run even if it is published (after a format change)"
        type: boolean
        default: false

permissions:
  contents: write                # push the data branch

concurrency:
  group: ecm9
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Published run
        run: git fetch --depth=1 origin data:data 2>/dev/null && git show data:latest.json > published.json || echo '{}' > published.json

      - name: Newer run out?
        id: check
        run: python3 ecm9/build.py --check --published published.json ${{ inputs.force && '--force' || '' }}

      - uses: actions/setup-python@v7
        if: steps.check.outputs.new == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.check.outputs.new == 'true'
        run: pip install -r requirements.txt && python -c "import eccodes; print('eccodes', eccodes.codes_get_api_version())"

      - name: Build
        if: steps.check.outputs.new == 'true'
        run: python ecm9/build.py --run ${{ steps.check.outputs.run }} --out out

      - name: Publish to the data branch
        if: steps.check.outputs.new == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git switch --orphan publish
          cp out/latest.json out/*.png .
          git add latest.json *.png
          git commit -q -m "run ${{ steps.check.outputs.run }}"
          git push -f origin HEAD:data
